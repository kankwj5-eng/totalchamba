name: Validar TotalChanba
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest
      - name: Validar Python y casos de calidad
        run: python -m pytest -q
      - name: Validar JavaScript del portal y herramientas
        run: |
          node --check public/assets/app.js
          node --check public/assets/toolkit.js
          node --check public/assets/bulletin.js
      - name: Verificar cartelera editorial y enlaces oficiales
        run: python -m agent.bulletin
      - name: Verificar fotografías temáticas
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          photos = list(Path('public/assets/occupations').glob('*.webp'))
          assert len(photos) == 12, f'Faltan fotografías: {len(photos)}'
          assert all(p.stat().st_size > 5000 for p in photos)
          PYCODE
