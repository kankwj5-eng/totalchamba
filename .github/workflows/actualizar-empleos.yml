name: Actualizar vacantes de Nicaragua
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-index
  cancel-in-progress: false
jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest
      - name: Validar lógica antes de actualizar
        run: python -m pytest -q
      - name: Ejecutar agente Python
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          CHAMBANI_GOOGLE_PLACES_ENABLED: ${{ vars.CHAMBANI_GOOGLE_PLACES_ENABLED || '0' }}
          CHAMBANI_PLACES_MAX_CALLS: ${{ vars.CHAMBANI_PLACES_MAX_CALLS || '8' }}
        run: python -m agent.collector
      - name: Validar JSON generado
        run: python -m json.tool public/data/jobs.json > /dev/null
      - name: Publicar solo cuando haya cambios
        run: |
          git config user.name 'totalchanba-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualizar índice de empleos'
            git push
          fi
