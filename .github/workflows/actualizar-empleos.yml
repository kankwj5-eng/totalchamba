name: Actualizar vacantes de Nicaragua
on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'requirements.txt'
      - '.github/workflows/actualizar-empleos.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-index
  cancel-in-progress: false
jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest
      - name: Validar lógica antes de actualizar
        run: python -m pytest -q
      - name: Ejecutar agente Python
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          CHAMBANI_GOOGLE_PLACES_ENABLED: ${{ vars.CHAMBANI_GOOGLE_PLACES_ENABLED || '0' }}
          CHAMBANI_PLACES_MAX_CALLS: ${{ vars.CHAMBANI_PLACES_MAX_CALLS || '8' }}
        run: python -m agent.collector
      - name: Validar integridad, evidencias y éxito de recopilación
        run: python -m agent.consistency public/data/jobs.json
      - name: Publicar solo cuando haya cambios
        run: |
          git config user.name 'totalchanba-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualizar índice de empleos'
            # La interfaz puede recibir commits mientras dura el recolector.
            # Reintentar de forma fast-forward/rebase, nunca hacer force-push.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "::notice::Rama main cambió durante la recopilación (intento $attempt)"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::warning::Otro cambio de datos produjo conflicto; se conserva el índice publicado y se intentará en la próxima corrida."
                exit 0
              fi
            done
            echo "::error::No fue posible publicar el índice después de tres intentos"
            exit 1
          fi
